name: ${COMPOSE_PROJECT_NAME:-irods-keycloak-admin-e2e}

services:
  keycloak-postgres:
    image: ${POSTGRES_IMAGE:-postgres:15}
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-KEYCLOAK}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:-KEYCLOAK}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-keycloak}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    volumes:
      - keycloak_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${KEYCLOAK_DB_USER}\" -d \"$${KEYCLOAK_DB_NAME}\""]
      start_period: 10s
      interval: 5s
      retries: 10

  keycloak:
    hostname: keycloak
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile-keycloak
    image: ${KEYCLOAK_IMAGE:-irods-keycloak-admin-keycloak:local}
    env_file:
      - ${KEYCLOAK_ENV_FILE:-./keycloak.env}
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/${KEYCLOAK_DB_NAME:-KEYCLOAK}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-localhost}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    ports:
      - "${KEYCLOAK_HTTPS_HOST_PORT:-8443}:8443"
      - "${KEYCLOAK_MANAGEMENT_HOST_PORT:-19090}:9000"
    cap_add:
      - SYS_ADMIN

volumes:
  keycloak_pgdata:
